name: CI Mineral Mapping

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backMineralMapping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backMineralMapping/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Syntax check entrypoints
        run: node --check index.js && node --check controllers/DemandeController.js && node --check controllers/service/scoreEngine.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontMineralMapping_v2/minerale_mapping_frontv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontMineralMapping_v2/minerale_mapping_frontv2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:3000
